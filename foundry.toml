[profile.default]
# Use existing contracts directory instead of src
src = "contracts"

# Output directory for compiled artifacts
out = "out"

# Libraries directory for dependencies
libs = ["dependencies"]

# Cache directory
cache_path = "cache_forge"

# Solidity compiler settings
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"  # Must match hardhat.config.ts for cross-tool compatibility

# Test settings
test = "test/foundry"

# Script directory for deployment scripts
script = "script"

# EVM version
evm_version = "paris"

# Gas reports
gas_reports = ["*"]

# Soldeer configuration
[soldeer]
remappings_generate = true
remappings_regenerate = false
recursive_deps = true

# Remappings will be auto-generated by Soldeer in remappings.txt

# Formatter settings
[fmt]
line_length = 120
tab_width = 2
bracket_spacing = true

# Documentation settings
[doc]
out = "docs"
title = "Hardhat + Foundry Template"

# RPC URL configurations for different networks
[rpc_endpoints]
mainnet = "https://1rpc.io/eth"
sepolia = "https://0xrpc.io/sep"
polygon = "https://1rpc.io/matic"

# Local development
anvil = "http://127.0.0.1:8545"

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.1.0"
